version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    allow:
      - dependency-name: public
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # supertest 7 系の型は onRequest の戻り値 (HttpsFunction) を受け付けず、統合テスト書き換えが必要なため据え置く (→ ADR-0087)
      - dependency-name: supertest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/supertest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tools/client-e2e
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      client-e2e-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
