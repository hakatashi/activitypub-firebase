name: Deploy
'on':
  push:
    branches:
      - main
  pull_request:
# main への push によるデプロイは同時に 1 つしか走らせない(ADR-0132)。
# PR の実行はデプロイしないので、ref ごとのグループに分けて互いに干渉させない。
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-main' || format('pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Dependencies
        run: npm --prefix functions ci
      - name: Run test
        run: npm --prefix functions test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm --prefix functions ci
      - name: Run build
        run: npm --prefix functions run build
      - name: Run typecheck
        run: npm --prefix functions run typecheck
      - name: Run lint
        run: npm --prefix functions run lint
      - name: Run format check
        run: npm --prefix functions run format:check
  deploy-firebase:
    name: Deploy to Firebase except for Hosting
    needs: [test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project:
          - id: activitypub-firebase
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE
          - id: activitypub-firebase-dev
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE_DEV
          - id: activitypub-firebase-bots
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE_BOTS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm --prefix functions ci
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.34.0
        with:
          args: deploy --only functions,firestore,storage
        env:
          GCP_SA_KEY: '${{secrets[matrix.project.key]}}'
          PROJECT_ID: '${{matrix.project.id}}'
  deploy-hosting:
    name: Deploy to Firebase Hosting
    needs: [test, lint, deploy-firebase]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Hosting のターゲットはプロジェクトごとに異なるため、ターゲットを明示する (→ ADR-0152)。
        project:
          - id: activitypub-firebase
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE
            target: activitypub
          - id: activitypub-firebase
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE
            target: mastodon
          - id: activitypub-firebase-dev
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE_DEV
            target: activitypub
          - id: activitypub-firebase-dev
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE_DEV
            target: mastodon
          - id: activitypub-firebase-bots
            key: FIREBASE_SERVICE_ACCOUNT_ACTIVITYPUB_FIREBASE_BOTS
            target: bots
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{secrets.GITHUB_TOKEN}}'
          firebaseServiceAccount: '${{secrets[matrix.project.key]}}'
          channelId: live
          projectId: '${{matrix.project.id}}'
          target: '${{matrix.project.target}}'
  smoke-test-dev:
    name: Smoke test (dev)
    needs: [deploy-firebase, deploy-hosting]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Warm up dev actor endpoint
        run: |
          for i in {1..5}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/activity+json" https://activitypub-dev.hakatashi.com/activitypub/u/hakatashi)
            if [ "$status" = "200" ]; then
              echo "Dev actor endpoint is up (HTTP 200)"
              exit 0
            fi
            echo "Waiting for dev actor endpoint (HTTP $status)..."
            sleep 5
          done
          echo "Dev actor endpoint failed to respond with HTTP 200"
          exit 1
      - name: Run activitypub-testing smoke test
        run: npx activitypub-testing test actor https://activitypub-dev.hakatashi.com/activitypub/u/hakatashi
  notify-deploy-failure:
    name: Notify Deploy Failure
    needs: [deploy-firebase, deploy-hosting, smoke-test-dev]
    if: always() && contains(needs.*.result, 'failure') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Create or update issue on deploy failure
        env:
          GH_TOKEN: ${{ secrets.USER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="Deploy ワークフローが main で失敗した"
          EXISTING_ISSUE=$(gh issue list --repo "$REPO" --search "${TITLE} in:title state:open" --json number -q '.[0].number')
          BODY=$(printf "main への push によるデプロイワークフローが失敗しました。\n\n- コミット: %s (%s)\n- 実行ログ: %s/%s/actions/runs/%s\n\n本番への反映が止まっている可能性があるため確認してください。" "$COMMIT_SHA" "$COMMIT_MSG" "$SERVER_URL" "$REPO" "$RUN_ID")

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label "area:infra,bug"
          fi